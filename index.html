<body><div id="root"></div>
<script type="text/babel">
const {motion:M,AnimatePresence:AP,useInView}=Motion;
const {useState,useEffect,useRef,useMemo}=React;
const R=Math.random,UNLOCK=new Date(2026,10,2,0,0,0),Q=new URLSearchParams(location.search),PREV=Q.get('preview')==='true';
const GOLD=['#ffd873','#f7b733','#fff3c4','#e89b2d'];
const fx=(k,x=innerWidth/2,y=innerHeight/2)=>dispatchEvent(new CustomEvent('fx',{detail:{k,x,y}}));

/* ---------- Built-in sound effects (WebAudio, no files) ---------- */
let AC;const ac=()=>AC||(AC=new(window.AudioContext||window.webkitAudioContext)());
const tone=(f,d=.3,ty='sine',v=.15,t0=0,f2)=>{try{const c=ac(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d)}catch(e){}};
const noise=(d=.4,v=.15,f0=800,f1=3000,t0=0)=>{try{const c=ac(),n=c.sampleRate*d|0,b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=R()*2-1;const s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain(),t=c.currentTime+t0;s.buffer=b;fl.type='bandpass';fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl).connect(g).connect(c.destination);s.start(t)}catch(e){}};
const SFX={chime:()=>[784,988,1175,1568].forEach((f,i)=>tone(f,.9,'sine',.12,i*.09)),
 horn:()=>{tone(300,.5,'sawtooth',.09,0,520);tone(450,.5,'square',.04,0,760);noise(.5,.08,2000,5000)},
 whoosh:()=>noise(.8,.2,300,4500),spark:()=>{for(let i=0;i<5;i++)tone(1800+R()*2200,.12,'triangle',.07,i*.04)},
 pop:()=>tone(420,.14,'sine',.2,0,90),blow:()=>noise(1,.3,600,150),lock:()=>{tone(220,.1,'square',.12);tone(140,.25,'square',.12,.1)},
 tada:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.6,'triangle',.12,i*.1))};
const sfx=k=>SFX[k]&&SFX[k]();

/* ---------- Particles + bursts (one canvas for everything) ---------- */
const CFG={gate:{snow:90},load:{snow:70},seoul:{snow:40,heart:28,bokeh:14},c3:{snow:110,leaf:16,bokeh:20},ten:{heart:20,snow:30,bokeh:10},gift:{bokeh:16,heart:14,snow:20},game:{heart:10,snow:30},c4:{bokeh:16,snow:25},c5:{snow:60,lantern:14,firefly:36,star:90}};
function FX({mode}){
 const ref=useRef(),m=useRef(mode);m.current=mode;
 useEffect(()=>{
  const cv=ref.current,g=cv.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2);
  let W,H,amb=[],bur=[],last,raf;
  const rs=()=>{W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)};rs();
  const mk=t=>{const p={t,x:R()*W,y:R()*H,ph:R()*6.28,a:.3+R()*.6,rot:R()*6.28};
   if(t=='snow')Object.assign(p,{r:1+R()*2.5,vx:R()-.5,vy:.4+R()});
   if(t=='leaf')Object.assign(p,{r:5+R()*5,vx:R()*.6-.2,vy:.5+R()*.7,vr:(R()-.5)*.05,c:['#e0802a','#c4561d','#d9a441'][R()*3|0]});
   if(t=='bokeh')Object.assign(p,{r:15+R()*40,vx:R()*.2-.1,vy:-.1-R()*.2,a:.05+R()*.1});
   if(t=='lantern')Object.assign(p,{r:7+R()*8,vx:0,vy:-.3-R()*.5,a:.8});
   if(t=='firefly')Object.assign(p,{r:1.5+R()*1.5,vx:0,vy:0});
   if(t=='star'){p.r=.4+R()*1.2;p.y=R()*H*.6}
   if(t=='heart')Object.assign(p,{r:8+R()*10,vx:R()-.5,vy:-.4-R()*.7,a:.5+R()*.4,c:['#ff6b9d','#ff9ec4','#ffb3d1','#e83e8c'][R()*4|0]});
   return p};
  const add=(n,o)=>{for(let i=0;i<n;i++)bur.push(o(i))};
  const on=e=>{const{k,x,y}=e.detail;
   if(k=='confetti')add(80,()=>({t:'conf',x,y,vx:(R()-.5)*12,vy:-R()*11-2,g:.28,life:130,w:5+R()*5,h:3+R()*4,rot:R()*6,vr:R()-.5,c:GOLD[R()*4|0]}));
   if(k=='smoke')add(40,()=>({t:'smoke',x:x+(R()-.5)*14,y,vx:(R()-.5)*.9,vy:-.5-R()*.9,r:9,life:170,c:'238,236,246'}));
   if(k=='fire')for(let i=0;i<4;i++)setTimeout(()=>{const cx=W*(.2+R()*.6),cy=H*(.15+R()*.3),h=R()*360;add(70,()=>{const s=1+R()*5,a=R()*6.28;return{t:'spark',x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:.05,life:80,r:2,c:`hsl(${h},95%,65%)`}})},i*450);
   if(k=='bfly')add(14,()=>({t:'bf',x:R()*W,y:H+20,vx:0,vy:-.7-R()*.7,ph:R()*6,life:520,c:['#f9a8d4','#93c5fd','#fcd34d','#c4b5fd'][R()*4|0]}));
   if(k=='hearts')add(26,()=>({t:'hb',x,y,vx:(R()-.5)*7,vy:-2-R()*4,g:.05,life:120,r:7+R()*9,c:['#ff6b9d','#ff9ec4','#ffd6e8','#e83e8c'][R()*4|0]}));
   if(k=='shoot')add(1,()=>({t:'shoot',x:W*.85,y:H*.1,vx:-16,vy:6,life:50}));
   if(k=='swirl')add(160,i=>({t:'swirl',cx:W/2,cy:H/2,ang:R()*6.28,rad:R()*40,vr:2+R()*4,va:.08+R()*.06,life:110+R()*40,r:1.5+R()*2.5,c:i%4?GOLD[R()*4|0]:'#d9822b'}));
  };
  const glow=p=>{let r=p.r,c='255,200,100',a=p.a;
   if(p.t=='star'){a=p.a*(.5+.5*Math.sin(p.ph*3));c='255,255,255';r*=3}
   if(p.t=='firefly'){a=.3+.7*Math.abs(Math.sin(p.ph));r*=4;c='255,230,120'}
   if(p.t=='lantern'){r*=2.5;c='255,150,50'}
   const gr=g.createRadialGradient(p.x,p.y,0,p.x,p.y,r);gr.addColorStop(0,`rgba(${c},${a})`);gr.addColorStop(1,`rgba(${c},0)`);g.fillStyle=gr;g.beginPath();g.arc(p.x,p.y,r,0,6.3);g.fill()};
  const dot=p=>{g.beginPath();g.arc(p.x,p.y,p.r,0,6.3);g.fill()};
  const hrt=r=>{g.beginPath();g.moveTo(0,r);g.bezierCurveTo(-r*1.4,-r*.2,-r*.5,-r*1.1,0,-r*.3);g.bezierCurveTo(r*.5,-r*1.1,r*1.4,-r*.2,0,r);g.fill()};
  addEventListener('fx',on);addEventListener('resize',rs);
  const tick=()=>{
   if(last!==m.current){last=m.current;amb=[];const c=CFG[last]||{};for(const t in c)for(let i=0;i<c[t];i++)amb.push(mk(t))}
   g.clearRect(0,0,W,H);
   for(const p of amb){
    p.ph+=.02;
    if(p.t=='snow'||p.t=='leaf'){p.x+=p.vx+Math.sin(p.ph)*.5;p.y+=p.vy;p.rot+=p.vr||0}
    else if(p.t=='firefly'){p.x+=Math.sin(p.ph)*.6;p.y+=Math.cos(p.ph*.7)*.5}
    else if(p.t!='star'){p.x+=p.vx+Math.sin(p.ph)*.3;p.y+=p.vy}
    if(p.y>H+20){p.y=-20;p.x=R()*W}if(p.y<-60){p.y=H+40;p.x=R()*W}
    if(p.x>W+20)p.x=-10;if(p.x<-20)p.x=W+10;
    g.save();
    if(p.t=='snow'){g.globalAlpha=p.a;g.fillStyle='#fff';dot(p)}
    else if(p.t=='leaf'){g.globalAlpha=p.a;g.translate(p.x,p.y);g.rotate(p.rot);g.fillStyle=p.c;g.beginPath();g.ellipse(0,0,p.r,p.r*.45,0,0,6.3);g.fill()}
    else if(p.t=='heart'){g.globalAlpha=p.a;g.translate(p.x,p.y);g.fillStyle=p.c;hrt(p.r)}
    else glow(p);
    g.restore()}
   bur=bur.filter(p=>p.life>0);
   for(const p of bur){
    p.life--;g.save();g.globalAlpha=Math.min(1,p.life/30);
    if(p.t=='swirl'){p.ang+=p.va;p.rad+=p.vr;p.x=p.cx+Math.cos(p.ang)*p.rad;p.y=p.cy+Math.sin(p.ang)*p.rad*.7-(150-p.life)*.4;g.fillStyle=p.c;dot(p)}
    else if(p.t=='shoot'){p.x+=p.vx;p.y+=p.vy;const gr=g.createLinearGradient(p.x,p.y,p.x-p.vx*6,p.y-p.vy*6);gr.addColorStop(0,'#fff');gr.addColorStop(1,'rgba(255,255,255,0)');g.strokeStyle=gr;g.lineWidth=2.5;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x-p.vx*6,p.y-p.vy*6);g.stroke()}
    else if(p.t=='bf'){p.ph+=.25;p.x+=Math.sin(p.ph*.3)*1.4;p.y+=p.vy;const f=Math.abs(Math.sin(p.ph));g.fillStyle=p.c;g.translate(p.x,p.y);for(const s of[-1,1]){g.beginPath();g.ellipse(s*6*f,0,7*f+1,10,s*.3,0,6.3);g.fill()}}
    else{p.x+=p.vx;p.y+=p.vy;if(p.g)p.vy+=p.g;
     if(p.t=='conf'){p.rot+=p.vr;p.vx*=.99;g.translate(p.x,p.y);g.rotate(p.rot);g.fillStyle=p.c;g.fillRect(-p.w/2,-p.h/2,p.w,p.h)}
     else if(p.t=='hb'){g.translate(p.x,p.y);g.fillStyle=p.c;hrt(p.r)}
     else if(p.t=='smoke'){p.r+=.8;g.fillStyle=`rgba(${p.c},.4)`;dot(p)}
     else{g.fillStyle=p.c;dot(p)}}
    g.restore()}
   raf=requestAnimationFrame(tick)};
  raf=requestAnimationFrame(tick);
  return()=>{cancelAnimationFrame(raf);removeEventListener('fx',on);removeEventListener('resize',rs)}
 },[]);
 return <canvas ref={ref} className="fixed inset-0 z-10 pointer-events-none"/>}

/* ---------- Kashmir backdrop ---------- */
const FAR="M0 560L160 430 290 500 470 330 630 470 790 380 960 490 1150 360 1300 470 1440 420V660H0Z",
 MID="M0 620L200 520 350 580 560 470 760 590 980 510 1200 600 1440 540V660H0Z",
 CAPS="M470 330L440 372 462 362 478 380 500 365ZM790 380L765 410 785 402 800 416 818 404ZM1150 360L1122 400 1142 392 1158 408 1180 394Z";
const SC={
 gate:{id:'g',sky:['#b9d0e4','#f2f7fc'],far:'#8da8c1',mid:'#a7bcd0',lake:'#e2ecf5'},
 load:{id:'d',sky:['#121a33','#3b4b70'],far:'#25314f',mid:'#1a2440',lake:'#0f1629'},
 c3:{id:'c',sky:['#1b0f09','#7a421e'],far:'#4a2a1b',mid:'#2f190f',lake:'#1d100a',glow:1},
 c4:{id:'t',bg:'linear-gradient(180deg,#4a1230 0%,#9c3358 38%,#f0d6c4 100%)'},
 c5:{id:'n',sky:['#060a20','#1b2356'],far:'#161c3f',mid:'#0d1230',lake:'#0a0f29',boat:1,sun:1}};
SC.seoul={id:'s',seoul:1};
SC.ten={id:'x',sky:['#2a0f24','#8a3a55'],far:'#4a1f3a',mid:'#33162c',lake:'#240e20',glow:1};
SC.gift={id:'f',bg:'linear-gradient(#2b1055,#7b2d6e 60%,#e8789a)'};SC.game=SC.gift;
SC['404']=SC.load;
function Scene({p}){
 if(p.bg)return <div className="absolute inset-0" style={{background:p.bg}}/>;
 if(p.seoul)return <SeoulBG/>;
 const Boat=({x,y,s})=><g transform={`translate(${x} ${y}) scale(${s})`} fill="#04060f"><path d="M0 0Q70 18 140 0L128-9H12Z"/><path d="M34-9L46-30H104L116-9Z"/><circle cx="75" cy="-17" r="4" fill="#ffb347"/></g>;
 return <div className="absolute inset-0" style={{background:`linear-gradient(${p.sky[0]},${p.sky[1]})`}}>
  {p.sun&&<M.div className="absolute inset-0" style={{background:'linear-gradient(#ff9a4d,#c2456b 55%,#3b2a6b)'}} initial={{opacity:1}} animate={{opacity:0}} transition={{duration:10}}/>}
  {p.glow&&<div className="absolute inset-0" style={{background:'radial-gradient(ellipse at 50% 70%,rgba(247,183,51,.35),transparent 60%)'}}/>}
  <svg className="absolute bottom-0 left-0 w-full h-[75%]" viewBox="0 0 1440 800" preserveAspectRatio="xMidYMax slice">
   <clipPath id="lk"><rect y="650" width="1440" height="150"/></clipPath>
   <path d={FAR} fill={p.far}/><path d={MID} fill={p.mid}/><path d={CAPS} fill="#fff" opacity=".75"/>
   <rect y="650" width="1440" height="150" fill={p.lake}/>
   <g clipPath="url(#lk)" opacity=".3" transform="translate(0 1300) scale(1 -1)"><path d={FAR} fill={p.far}/></g>
   {p.boat&&<M.g animate={{x:[0,-60,0]}} transition={{duration:24,repeat:Infinity,ease:'easeInOut'}}><Boat x={980} y={705} s={1}/><Boat x={300} y={690} s={.6}/></M.g>}
  </svg>
  {p.id=='g'&&<div className="absolute inset-x-0 bottom-0 h-1/2" style={{background:'linear-gradient(transparent,rgba(255,255,255,.7))'}}/>}
 </div>}

function SeoulBG(){
 const B=[[0,540,70],[60,500,60],[110,560,80],[190,470,70],[250,530,90],[340,490,60],[400,550,80],[480,520,70],[550,480,90],[640,540,60],[700,500,80],[780,560,70],[850,510,90],[940,470,60],[1000,540,80],[1080,500,70],[1150,550,90],[1240,490,70],[1310,530,130]];
 return <div className="absolute inset-0" style={{background:'linear-gradient(#1a1040,#7b2d6e 55%,#f08a6a)'}}>
  <svg className="absolute bottom-0 left-0 w-full h-[75%]" viewBox="0 0 1440 800" preserveAspectRatio="xMidYMax slice">
   <path d="M250 800Q560 440 760 425T1200 800Z" fill="#1a0f33"/>
   <g fill="#120a26">{B.map(([x,y,w],i)=><rect key={i} x={x} y={y} width={w} height={800-y}/>)}</g>
   <g fill="#ffd873">{B.flatMap(([x,y,w],i)=>[0,1,2,3,4,5].map(j=><rect key={i+'-'+j} x={x+8+(j%2)*(w/2-4)} y={y+14+(j>>1)*34} width="6" height="9" opacity={(i*7+j*3)%4?.85:.15}/>))}</g>
   <g fill="#0d0620"><path d="M752 428L757 310H763L768 428Z"/><rect x="759" y="205" width="2" height="90"/></g>
   <M.g animate={{opacity:[.75,1,.75]}} transition={{repeat:Infinity,duration:2.4}}><ellipse cx="760" cy="296" rx="26" ry="11" fill="#ffcf70"/><rect x="750" y="280" width="20" height="14" rx="3" fill="#ffb347"/></M.g>
  </svg></div>}
/* ---------- Shared bits ---------- */
const Pg=({cls='',exit,children})=><M.div initial={{opacity:0}} animate={{opacity:1}} exit={exit||{opacity:0}} transition={{duration:.9}} className={'relative z-20 '+cls}>{children}</M.div>;
const Btn=({onClick,...p})=><button {...p} onClick={e=>{sfx("pop");onClick&&onClick(e)}} className="glass rounded-full px-10 py-4 text-lg font-semibold tracking-wide text-white hover:scale-105 active:scale-95 transition"/>;

/* ---------- Chapter 1 ---------- */
function Gate({done}){
 const[t,setT]=useState(UNLOCK-Date.now());
 useEffect(()=>{const i=setInterval(()=>setT(UNLOCK-Date.now()),1000);return()=>clearInterval(i)},[]);
 useEffect(()=>{if(t<=0)done()},[t<=0]);
 const s=Math.max(0,t/1000|0),u=[['Days',s/86400|0],['Hours',s/3600%24|0],['Minutes',s/60%60|0],['Seconds',s%60]];
 return <Pg cls="min-h-screen flex flex-col items-center justify-center text-center px-5 gap-5 text-[#1f3553]">
  <h1 className="font-disp text-4xl md:text-6xl max-w-3xl leading-tight">Hold up. It’s not November 2nd yet! No cheating, Huma. 😉</h1>
  <p className="font-serif italic text-xl md:text-3xl opacity-80">Patience is a virtue (even for dietitians). Come back at midnight.</p>
  <div className="flex gap-3 md:gap-5 mt-4">{u.map(([l,v])=><div key={l} className="rounded-2xl bg-white/50 backdrop-blur border border-white/70 px-3 py-4 w-20 md:w-28 shadow-lg"><div className="font-disp text-3xl md:text-5xl tabular-nums">{String(v).padStart(2,'0')}</div><div className="text-[10px] md:text-xs tracking-widest opacity-70">{l}</div></div>)}</div>
 </Pg>}

/* ---------- Chapter 2 ---------- */
function Load({done}){
 const[p,setP]=useState(0),[bad,setBad]=useState(false);
 useEffect(()=>{const t0=performance.now();let r,to;const f=t=>{const k=Math.min(1,(t-t0)/2600);setP(k*87|0);if(k<1)r=requestAnimationFrame(f);else{setBad(true);sfx('lock');to=setTimeout(done,1500)}};r=requestAnimationFrame(f);return()=>{cancelAnimationFrame(r);clearTimeout(to)}},[]);
 return <Pg cls="min-h-screen flex flex-col items-center justify-center gap-6 px-6 text-center">
  <p className="font-serif italic text-3xl md:text-4xl">{bad?'Uh-oh… something went wrong 😬':'Preparing something special for Huma…'}</p>
  <div className="w-80 max-w-full h-3 rounded-full bg-white/15 overflow-hidden"><M.div className="h-full rounded-full" animate={bad?{x:[0,-6,6,-4,0]}:{}} style={{width:p+'%',background:bad?'#ff6b6b':'linear-gradient(90deg,#f7b733,#fff3c4)'}}/></div>
  <span className="opacity-70 tabular-nums">{bad?'ERR_SURPRISE_STUCK':p+'%'}</span></Pg>}
function E404({go}){
 return <Pg exit={{opacity:0,scale:1.5,filter:'blur(24px)'}} cls="min-h-screen flex flex-col items-center justify-center gap-5 px-6 text-center">
  <M.h1 animate={{x:[0,-3,3,0]}} transition={{repeat:Infinity,duration:.25,repeatDelay:2.5}} className="font-disp font-bold text-4xl md:text-6xl">404 - Surprise Not Found</M.h1>
  <p className="font-serif italic text-xl md:text-3xl opacity-90 max-w-xl">Looks like your birthday surprise got lost in the Gulmarg snowdrifts.</p>
  <Btn onClick={go}>Refresh &amp; Find It 🎉</Btn></Pg>}

/* ---------- Chapter 2.5: Seoul ---------- */
const BAN=[['Scene 1 · The Kitchen','“Bas ek bite, bola tha!” says Huma, guarding her plate. Farhan, already holding the last fry: “Darling, it was a very small plate.”'],
['Scene 2 · The Sofa','She pauses the episode to explain the plot to the one person who has watched it with her. Twice. He nods like a man who understood everything. (He did not.)'],
['Scene 3 · Pakistani Drama Night','“Mark my words, it’s the mother-in-law.” “Huma, it’s episode two.” “Exactly. She’s early.”'],
['Scene 4 · The Tangerine Rule','When life gives us tangerines, she peels, he eats, and they both pretend the split was fair.'],
['Final Scene · Seoul','No subtitles needed. 사랑해 means “I love you”, and darling, I mean it in every language.']];

    </svg></div>
   <div className="grid grid-cols-2 gap-6 w-full items-end">

     {[[55,70,'#d6264b'],[105,70,'#d6264b'],[80,64,'#d6264b'],[68,76,'#8cc63f'],[94,76,'#8cc63f'],[80,74,'#ff9a2e'],[60,64,'#3b3a8a'],[100,64,'#3b3a8a']].map(([x,y,c],i)=><circle key={i} cx={x} cy={y} r="7" fill={c}/>)}
     <path d="M76 58q4-12 12-6-4 8-12 6Z" fill="#3f9a4a"/></svg></div>
    <div className="cursor-pointer" onMouseEnter={()=>show('parfait')} onClick={()=>show('parfait')}><svg viewBox="0 0 100 150" className="w-full max-w-[8rem] mx-auto drop-shadow-xl"><clipPath id="gl"><path d="M15 20L85 20L72 130Q50 140 28 130Z"/></clipPath>
     <g clipPath="url(#gl)"><rect y="100" width="100" height="45" fill="#9b1d4a"/><rect y="78" width="100" height="22" fill="#fff3e2"/><rect y="58" width="100" height="20" fill="#d94f7a"/><rect y="40" width="100" height="18" fill="#fff3e2"/><rect y="20" width="100" height="20" fill="#e7b46a"/></g>
     <path d="M15 20L85 20L72 130Q50 140 28 130Z" fill="rgba(255,255,255,.2)" stroke="#fff" strokeWidth="2"/><circle cx="40" cy="16" r="8" fill="#e0283e"/><circle cx="60" cy="14" r="7" fill="#3b3a8a"/><path d="M48 10q6-10 14-4-4 8-14 4Z" fill="#3f9a4a"/></svg></div></div>
   <div onClick={e=>{if(!stamp){setStamp(true);sfx('pop');fx('confetti',e.clientX,e.clientY)}}} className="relative w-full max-w-md rounded-lg bg-[#fff6e3] text-[#5b1a33] p-6 text-left shadow-xl cursor-pointer" style={{border:'2px dashed #c9983a'}}>

 const[show,setShow]=useState(false);

 return <Pg cls="min-h-screen flex flex-col items-center justify-center text-center px-5 gap-10 py-16">
  <button aria-label="Moon" onClick={()=>fx('shoot')} className="fixed top-20 right-[12%] w-16 h-16 md:w-24 md:h-24 rounded-full z-30" style={{background:'radial-gradient(circle at 35% 35%,#fffbe8,#f3e3a8 60%,#d9c27a)',boxShadow:'0 0 60px 20px rgba(255,236,170,.35)'}}/>
  <M.p initial={{opacity:0,y:20}} animate={{opacity:1,y:0}} transition={{delay:1,duration:1.5}} className="font-serif italic text-3xl md:text-5xl text-amber-100 max-w-3xl leading-snug">Every birthday is the beginning of another amazing chapter.</M.p>
  <AP>{show&&<M.div initial={{opacity:0,scale:.9,y:30}} animate={{opacity:1,scale:1,y:0}} transition={{duration:1.4}} className="glass rounded-3xl p-8 md:p-12 max-w-xl shadow-2xl" style={{background:'rgba(255,170,60,.12)'}}>
   <h2 onClick={e=>fx('confetti',e.clientX,e.clientY)} className="font-disp font-bold text-4xl md:text-5xl text-amber-200 cursor-pointer select-none">Happy Birthday, Huma ❤️</h2>
   <p className="font-serif italic text-2xl md:text-3xl mt-4 leading-snug">Thank you for making the world a little brighter. Wishing you happiness, good health, and endless love in the year ahead.</p></M.div>}</AP>
 </Pg>}

/* ---------- App: stages, audio, easter eggs ---------- */
function fade(a,to,ms=2500){
 clearInterval(a._t);if(to>0&&a.paused)a.play().catch(()=>{});
 const from=a.volume,t0=Date.now();
 a._t=setInterval(()=>{const k=Math.min(1,(Date.now()-t0)/ms);a.volume=Math.max(0,Math.min(1,from+(to-from)*k));if(k>=1){clearInterval(a._t);if(!to)a.pause()}},50)}
function App(){
 const[st,setSt]=useState((PREV&&!Q.get('gate'))||Date.now()>=UNLOCK?'load':'gate');
 const[on,setOn]=useState(false),[ask,setAsk]=useState(true);
 const au=useMemo(()=>{const g=new Audio('./Goblin.mp3'),b=new Audio('./Birthday.mp3');g.loop=b.loop=true;g.volume=b.volume=0;return{g,b}},[]);
 useEffect(()=>{
  if(!on){fade(au.g,0,400);fade(au.b,0,400)}
  else if(['seoul','c3','ten','gift','game'].includes(st)){fade(au.b,0,1000);fade(au.g,.7)}
  else if(st=='c4'||st=='c5'){fade(au.g,0,3500);fade(au.b,.75,3500)}
  else{fade(au.g,0,800);fade(au.b,0,800)}
 },[on,st]);
 useEffect(()=>{document.body.style.overflowY=['seoul','c3','ten','gift','game','c4','c5'].includes(st)?'auto':'hidden';scrollTo(0,0)},[st]);
 useEffect(()=>{let t;const d=()=>{t=setTimeout(()=>fx('bfly'),3000)},u=()=>clearTimeout(t);
  addEventListener('pointerdown',d);addEventListener('pointerup',u);addEventListener('pointercancel',u);
  return()=>{removeEventListener('pointerdown',d);removeEventListener('pointerup',u);removeEventListener('pointercancel',u)}},[]);
 useEffect(()=>{const m={confetti:'horn',fire:'whoosh',bfly:'chime',shoot:'spark',swirl:'whoosh'},f=e=>m[e.detail.k]&&sfx(m[e.detail.k]),r=()=>{try{ac().resume()}catch(e){}};
  addEventListener('fx',f);addEventListener('pointerdown',r);return()=>{removeEventListener('fx',f);removeEventListener('pointerdown',r)}},[]);
 const p=SC[st],mode=st=='404'?'load':st;
 return <div className="relative min-h-screen text-white font-sans overflow-x-hidden">
  <div className="fixed inset-0 z-0"><AP><M.div key={p.id} className="absolute inset-0" initial={{opacity:0}} animate={{opacity:1}} exit={{opacity:0}} transition={{duration:1.2}}><Scene p={p}/></M.div></AP></div>
  <FX mode={mode}/>
  <AP mode="wait">
   {st=='gate'&&<Gate key="g" done={()=>setSt('load')}/>}
   {st=='load'&&<Load key="l" done={()=>setSt('404')}/>}
   {st=='404'&&<E404 key="4" go={()=>{fx('swirl');setSt('seoul')}}/>}
   {st=='seoul'&&<SeoulCh key="s" next={()=>setSt('c3')}/>}
   {st=='c3'&&<C3 key="3" next={()=>setSt('ten')}/>}
   {st=='ten'&&<TenCh key="t" next={()=>setSt('gift')}/>}
   {st=='gift'&&<GiftCh key="f" next={()=>setSt('game')}/>}
   {st=='game'&&<GameCh key="gm" next={()=>setSt('c4')}/>}
   {st=='c4'&&<C4 key="c4" next={()=>setSt('c5')}/>}
   {st=='c5'&&<C5 key="5"/>}
  </AP>
  <AP>{ask&&!on&&<M.div initial={{opacity:0,y:-20}} animate={{opacity:1,y:0}} exit={{opacity:0,y:-20}} className="fixed top-20 left-1/2 -translate-x-1/2 z-50 glass rounded-2xl px-5 py-3 flex items-center gap-4 text-sm w-[92%] max-w-xl text-white" style={{background:'rgba(20,30,55,.6)'}}>
   <span className="flex-1">For the best cinematic experience, enable sound 🎵</span>
   <button onClick={()=>setOn(true)} className="rounded-full bg-amber-300 text-slate-900 font-semibold px-4 py-1.5 whitespace-nowrap">Turn On Audio</button>
   <button onClick={()=>setAsk(false)} aria-label="Dismiss" className="opacity-60">✕</button></M.div>}</AP>
  <button onClick={()=>setOn(!on)} aria-label="Toggle music" className="fixed top-4 right-4 z-50 glass rounded-full pl-2 pr-4 py-2 flex items-center gap-3 text-white" style={{background:'rgba(20,30,55,.5)'}}>
   <M.div animate={on?{rotate:360}:{}} transition={{repeat:Infinity,duration:4,ease:'linear'}} className="w-9 h-9 rounded-full" style={{background:'#222',boxShadow:'inset 0 0 0 11px #1a1a1a,inset 0 0 0 13px #f7b733'}}/>
   <span className="flex items-end gap-0.5 h-5">{[0,1,2,3].map(i=><M.i key={i} className="block w-0.5 h-full bg-amber-200 rounded origin-bottom" animate={on?{scaleY:[.2,1,.35,.8,.2]}:{scaleY:.2}} transition={{repeat:Infinity,duration:.9,delay:i*.15}}/>)}</span>
   <span className="text-xs">{on?'❚❚':'▶'}</span></button>
  {PREV&&<div className="fixed bottom-3 left-3 z-50 flex flex-wrap gap-1 text-xs max-w-[85vw]">{['gate','load','404','seoul','c3','ten','gift','game','c4','c5'].map(s=><button key={s} onClick={()=>setSt(s)} className="glass rounded px-2 py-1 text-white" style={{background:'rgba(20,30,55,.6)'}}>{s}</button>)}</div>}
 </div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>

<style>

              radial-gradient(circle at 20% 15%, #fff7e4 0%, #fae8c3 40%, #e8c991 100%);

<div id="root"></div>

<script type="text/babel">
const { motion: M, AnimatePresence: AP, useInView } = Motion;
const { useState, useEffect, useRef, useMemo } = React;
const R = Math.random;
const UNLOCK = new Date(2026, 10, 2, 0, 0, 0); // Nov 2, 2026
const Q = new URLSearchParams(location.search);
const PREV = Q.get('preview') === 'true';

/* Web Audio Synthesizer */
class SoundEngine {
  constructor() { this.ctx = null; }
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }
  playChime() {
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + i * 0.09);
      gain.gain.setValueAtTime(0.18, now + i * 0.09);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.9);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now + i * 0.09);
      osc.stop(now + i * 0.09 + 1.0);
    });
  }
  playWhoosh() {
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(280, now);
    osc.frequency.exponentialRampToValueAtTime(50, now + 0.65);
    gain.gain.setValueAtTime(0.24, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.7);
  }
  playTada() {
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const notes = [440, 554.37, 659.25, 880];
    notes.forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now + (idx === 3 ? 0.32 : idx * 0.09));
      const dur = idx === 3 ? 1.2 : 0.22;
      gain.gain.setValueAtTime(0.2, now + (idx === 3 ? 0.32 : idx * 0.09));
      gain.gain.exponentialRampToValueAtTime(0.001, now + (idx === 3 ? 0.32 : idx * 0.09) + dur);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now + (idx === 3 ? 0.32 : idx * 0.09));
      osc.stop(now + (idx === 3 ? 0.32 : idx * 0.09) + dur + 0.1);
    });
  }
}
const sounds = new SoundEngine();

/* Global Event Dispatcher */
const fx = (k, x = innerWidth / 2, y = innerHeight / 2) => dispatchEvent(new CustomEvent('fx', { detail: { k, x, y } }));

/* ---------- Canvas Particle System ---------- */
const CFG = {
  gate: { snow: 85 },
  load: { snow: 70 },
  '404': { snow: 85 },
  seoul: { snow: 95, kheart: 18, bokeh: 16 },
  c3: { snow: 90, leaf: 20, bokeh: 22 },
  reasons: { bokeh: 24, kheart: 14, snow: 35 },
  coupons: { bokeh: 26, snow: 35 },
  c4: { bokeh: 22, snow: 30 },
  c5: { snow: 50, lantern: 18, firefly: 36, star: 95 }
};
const GOLD = ['#ffd873', '#f7b733', '#fff3c4', '#e89b2d', '#f43f5e'];

function FX({ mode }) {
  const ref = useRef(), m = useRef(mode);
  m.current = mode;

  useEffect(() => {
    const cv = ref.current, g = cv.getContext('2d');
    const dpr = Math.min(devicePixelRatio || 1, 2);
    let W, H, amb = [], bur = [], last, raf;

    const rs = () => {
      W = innerWidth;
      H = innerHeight;
      cv.width = W * dpr;
      cv.height = H * dpr;
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    rs();

    const mk = t => {
      const p = { t, x: R() * W, y: R() * H, ph: R() * 6.28, a: 0.3 + R() * 0.6, rot: R() * 6.28 };
      if (t === 'snow') Object.assign(p, { r: 1 + R() * 2.8, vx: R() - 0.5, vy: 0.5 + R() * 1.2 });
      if (t === 'leaf') Object.assign(p, { r: 5 + R() * 6, vx: R() * 0.7 - 0.2, vy: 0.6 + R() * 0.8, vr: (R() - 0.5) * 0.05, c: ['#e0802a', '#c4561d', '#d9a441', '#b93815'][R() * 4 | 0] });
      if (t === 'bokeh') Object.assign(p, { r: 16 + R() * 38, vx: R() * 0.2 - 0.1, vy: -0.15 - R() * 0.25, a: 0.04 + R() * 0.08 });
      if (t === 'kheart') Object.assign(p, { r: 7 + R() * 8, vx: (R() - 0.5) * 0.4, vy: -0.4 - R() * 0.6, vr: (R() - 0.5) * 0.03, a: 0.35 + R() * 0.45, c: ['#ff758c', '#ff7eb3', '#ffa8a8'][R() * 3 | 0] });
      if (t === 'lantern') Object.assign(p, { r: 8 + R() * 10, vx: Math.sin(p.ph) * 0.2, vy: -0.35 - R() * 0.45, a: 0.85 });
      if (t === 'firefly') Object.assign(p, { r: 1.5 + R() * 1.5, vx: 0, vy: 0 });
      if (t === 'star') { p.r = 0.5 + R() * 1.4; p.y = R() * H * 0.65; }
      return p;
    };

    const add = (n, o) => { for (let i = 0; i < n; i++) bur.push(o(i)); };

    const on = e => {
      const { k, x, y } = e.detail;
      if (k === 'confetti') {
        sounds.playTada();
        add(95, () => ({ t: 'conf', x, y, vx: (R() - 0.5) * 14, vy: -R() * 12 - 3, g: 0.28, life: 140, w: 6 + R() * 6, h: 3 + R() * 4, rot: R() * 6, vr: R() - 0.5, c: GOLD[R() * GOLD.length | 0] }));
      }
      if (k === 'smoke') {
        sounds.playWhoosh();
        add(45, () => ({ t: 'smoke', x: x + (R() - 0.5) * 40, y: y + (R() - 0.5) * 15, vx: (R() - 0.5) * 1.8, vy: -1.4 - R() * 2.2, r: 8 + R() * 12, maxR: 28 + R() * 20, life: 110, c: '235,235,245' }));
      }
      if (k === 'fire') {
        sounds.playTada();
        for (let i = 0; i < 5; i++) {
          setTimeout(() => {
            const cx = W * (0.15 + R() * 0.7), cy = H * (0.15 + R() * 0.35), h = R() * 360;
            add(75, () => {
              const s = 1.5 + R() * 6, a = R() * 6.28;
              return { t: 'spark', x: cx, y: cy, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: 0.05, life: 85, r: 2.2, c: `hsl(${h},95%,65%)` };
            });
          }, i * 360);
        }
      }
      if (k === 'bfly') {
        add(18, () => ({ t: 'bf', x: R() * W, y: H + 30, vx: 0, vy: -0.8 - R() * 0.8, ph: R() * 6, life: 540, c: ['#ffb3c6', '#a5b4fc', '#fde047', '#e879f9'][R() * 4 | 0] }));
      }
      if (k === 'shoot') {
        sounds.playChime();
        add(1, () => ({ t: 'shoot', x: W * 0.88, y: H * 0.12, vx: -18, vy: 7, life: 48 }));
      }
      if (k === 'swirl') {
        sounds.playChime();
        add(180, i => ({ t: 'swirl', cx: W / 2, cy: H / 2, ang: R() * 6.28, rad: R() * 30, vr: 2.5 + R() * 4, va: 0.08 + R() * 0.06, life: 120 + R() * 40, r: 1.8 + R() * 2.5, c: i % 4 ? GOLD[R() * 4 | 0] : '#ff5a79' }));
      }
      if (k === 'heartburst') {
        sounds.playChime();
        add(25, () => ({ t: 'burstheart', x, y, vx: (R() - 0.5) * 8, vy: -R() * 7 - 2, life: 90, scale: 0.8 + R() * 0.8, c: ['#ff4d6d', '#ff758f', '#ffb3c6'][R() * 3 | 0] }));
      }
    };

    const drawHeart = (ctx, x, y, size, color, alpha = 1) => {
      ctx.save();
      ctx.translate(x, y);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      ctx.beginPath();
      const topCurveHeight = size * 0.3;
      ctx.moveTo(0, topCurveHeight);
      ctx.bezierCurveTo(0, 0, -size / 2, 0, -size / 2, topCurveHeight);
      ctx.bezierCurveTo(-size / 2, (size + topCurveHeight) / 2, 0, size, 0, size * 1.15);
      ctx.bezierCurveTo(0, size, size / 2, (size + topCurveHeight) / 2, size / 2, topCurveHeight);
      ctx.bezierCurveTo(size / 2, 0, 0, 0, 0, topCurveHeight);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    };

    const glow = p => {
      let r = p.r, c = '255,200,100', a = p.a;
      if (p.t === 'star') { a = p.a * (0.4 + 0.6 * Math.sin(p.ph * 3)); c = '255,255,255'; r *= 2.8; }
      if (p.t === 'firefly') { a = 0.3 + 0.7 * Math.abs(Math.sin(p.ph)); r *= 4.5; c = '255,235,130'; }
      if (p.t === 'lantern') { r *= 2.8; c = '255,160,60'; }
      const gr = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
      gr.addColorStop(0, `rgba(${c},${a})`);
      gr.addColorStop(1, `rgba(${c},0)`);
      g.fillStyle = gr;
      g.beginPath();
      g.arc(p.x, p.y, r, 0, 6.28);
      g.fill();
    };

    const dot = p => { g.beginPath(); g.arc(p.x, p.y, p.r, 0, 6.28); g.fill(); };

    addEventListener('fx', on);
    addEventListener('resize', rs);

    const tick = () => {
      if (last !== m.current) {
        last = m.current;
        amb = [];
        const c = CFG[last] || {};
        for (const t in c) for (let i = 0; i < c[t]; i++) amb.push(mk(t));
      }
      g.clearRect(0, 0, W, H);

      for (const p of amb) {
        p.ph += 0.02;
        if (p.t === 'snow' || p.t === 'leaf') {
          p.x += p.vx + Math.sin(p.ph) * 0.6;
          p.y += p.vy;
          p.rot += p.vr || 0;
        } else if (p.t === 'kheart') {
          p.x += Math.sin(p.ph) * 0.8;
          p.y += p.vy;
        } else if (p.t === 'firefly') {
          p.x += Math.sin(p.ph) * 0.8;
          p.y += Math.cos(p.ph * 0.7) * 0.6;
        } else if (p.t !== 'star') {
          p.x += p.vx + Math.sin(p.ph) * 0.3;
          p.y += p.vy;
        }

        if (p.y > H + 30) { p.y = -30; p.x = R() * W; }
        if (p.y < -60) { p.y = H + 40; p.x = R() * W; }
        if (p.x > W + 30) p.x = -15;
        if (p.x < -30) p.x = W + 15;

        g.save();
        if (p.t === 'snow') {
          g.globalAlpha = p.a;
          g.fillStyle = '#fff';
          dot(p);
        } else if (p.t === 'leaf') {
          g.globalAlpha = p.a;
          g.translate(p.x, p.y);
          g.rotate(p.rot);
          g.fillStyle = p.c;
          g.beginPath();
          g.ellipse(0, 0, p.r, p.r * 0.45, 0, 0, 6.28);
          g.fill();
        } else if (p.t === 'kheart') {
          drawHeart(g, p.x, p.y, p.r, p.c, p.a);
        } else {
          glow(p);
        }
        g.restore();
      }

      bur = bur.filter(p => p.life > 0);
      for (const p of bur) {
        p.life--;
        g.save();
        g.globalAlpha = Math.min(1, p.life / 25);

        if (p.t === 'swirl') {
          p.ang += p.va;
          p.rad += p.vr;
          p.x = p.cx + Math.cos(p.ang) * p.rad;
          p.y = p.cy + Math.sin(p.ang) * p.rad * 0.7 - (140 - p.life) * 0.45;
          g.fillStyle = p.c;
          dot(p);
        } else if (p.t === 'shoot') {
          p.x += p.vx;
          p.y += p.vy;
          const gr = g.createLinearGradient(p.x, p.y, p.x - p.vx * 7, p.y - p.vy * 7);
          gr.addColorStop(0, '#fff');
          gr.addColorStop(1, 'rgba(255,255,255,0)');
          g.strokeStyle = gr;
          g.lineWidth = 3;
          g.beginPath();
          g.moveTo(p.x, p.y);
          g.lineTo(p.x - p.vx * 7, p.y - p.vy * 7);
          g.stroke();
        } else if (p.t === 'bf') {
          p.ph += 0.28;
          p.x += Math.sin(p.ph * 0.3) * 1.5;
          p.y += p.vy;
          const f = Math.abs(Math.sin(p.ph));
          g.fillStyle = p.c;
          g.translate(p.x, p.y);
          for (const s of [-1, 1]) {
            g.beginPath();
            g.ellipse(s * 7 * f, 0, 8 * f + 1, 11, s * 0.3, 0, 6.28);
            g.fill();
          }
        } else if (p.t === 'smoke') {
          p.x += p.vx;
          p.y += p.vy;
          p.r += (p.maxR - p.r) * 0.04;
          const gr = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
          gr.addColorStop(0, `rgba(${p.c},0.45)`);
          gr.addColorStop(0.6, `rgba(${p.c},0.2)`);
          gr.addColorStop(1, `rgba(${p.c},0)`);
          g.fillStyle = gr;
          g.beginPath();
          g.arc(p.x, p.y, p.r, 0, 6.28);
          g.fill();
        } else if (p.t === 'burstheart') {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.15;
          drawHeart(g, p.x, p.y, 14 * p.scale, p.c, Math.min(1, p.life / 30));
        } else {
          p.x += p.vx;
          p.y += p.vy;
          if (p.g) p.vy += p.g;
          if (p.t === 'conf') {
            p.rot += p.vr;
            p.vx *= 0.99;
            g.translate(p.x, p.y);
            g.rotate(p.rot);
            g.fillStyle = p.c;
            g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          } else {
            g.fillStyle = p.c;
            dot(p);
          }
        }
        g.restore();
      }
      raf = requestAnimationFrame(tick);
    };

    raf = requestAnimationFrame(tick);
    return () => {
      cancelAnimationFrame(raf);
      removeEventListener('fx', on);
      removeEventListener('resize', rs);
    };
  }, []);

  return <canvas ref={ref} className="fixed inset-0 z-10 pointer-events-none" />;
}

/* ---------- Vector Sceneries ---------- */
const KASHMIR_FAR = "M0 560L160 430 290 500 470 330 630 470 790 380 960 490 1150 360 1300 470 1440 420V800H0Z";
const KASHMIR_MID = "M0 620L200 520 350 580 560 470 760 590 980 510 1200 600 1440 540V800H0Z";
const KASHMIR_CAPS = "M470 330L440 372 462 362 478 380 500 365ZM790 380L765 410 785 402 800 416 818 404ZM1150 360L1122 400 1142 392 1158 408 1180 394Z";

const SC = {
  gate: { id: 'g', sky: ['#a8c0d6', '#eaf2f8'], far: '#7b9bb7', mid: '#98b0c8', lake: '#dbe7f2' },
  load: { id: 'd', sky: ['#0f172a', '#2c3e66'], far: '#1e2945', mid: '#141c33', lake: '#0c1224' },
  '404': { id: 'd', sky: ['#0f172a', '#2c3e66'], far: '#1e2945', mid: '#141c33', lake: '#0c1224' },
  seoul: { id: 's', sky: ['#120c24', '#3d1a45'], namsan: true },
  c3: { id: 'c', sky: ['#1c100a', '#6f391a'], far: '#452314', mid: '#2d140a', lake: '#1a0b05', glow: 1 },
  reasons: { id: 'rs', bg: 'linear-gradient(180deg, #180d21 0%, #3e1b34 50%, #17091a 100%)' },
  coupons: { id: 'cp', bg: 'linear-gradient(180deg, #1f0d24 0%, #441738 50%, #200b21 100%)' },
  c4: { id: 't', bg: 'linear-gradient(180deg, #380d24 0%, #7b2444 42%, #d89f83 100%)' },
  c5: { id: 'n', sky: ['#040718', '#141c42'], far: '#111736', mid: '#0a0d24', lake: '#070a1c', boat: 1, sun: 1 }
};

function Scene({ p }) {
  if (p.bg) return <div className="absolute inset-0" style={{ background: p.bg }} />;

  const Shikara = ({ x, y, s }) => (
    <g transform={`translate(${x} ${y}) scale(${s})`} fill="#03050c">
      <path d="M0 0Q70 18 140 0L128-9H12Z" />
      <path d="M34-9L46-30H104L116-9Z" />
      <circle cx="75" cy="-17" r="4.5" fill="#ffb347" style={{ filter: 'drop-shadow(0 0 8px #ff9a1f)' }} />
      <line x1="75" y1="-9" x2="75" y2="2" stroke="#ffb347" strokeWidth="1.5" />
    </g>
  );

  return (
    <div className="absolute inset-0" style={{ background: `linear-gradient(${p.sky[0]}, ${p.sky[1]})` }}>
      {p.sun && (
        <M.div
          className="absolute inset-0"
          style={{ background: 'linear-gradient(#ff8c42, #b8335b 55%, #301f5e)' }}
          initial={{ opacity: 1 }}
          animate={{ opacity: 0 }}
          transition={{ duration: 12, ease: 'easeInOut' }}
        />
      )}
      {p.glow && (
        <div className="absolute inset-0" style={{ background: 'radial-gradient(ellipse at 50% 65%, rgba(247,183,51,0.32), transparent 65%)' }} />
      )}

      {p.namsan ? (
        <svg className="absolute bottom-0 left-0 w-full h-[80%]" viewBox="0 0 1440 800" preserveAspectRatio="xMidYMax slice">
          <path d="M0 650 Q400 480 850 430 Q1200 480 1440 620 L1440 800 L0 800 Z" fill="#180e2b" />
          <path d="M200 680 Q650 560 1100 540 Q1300 580 1440 690 L1440 800 L0 800 Z" fill="#0f071d" />

function Gate({ done }) {
  const [t, setT] = useState(UNLOCK - Date.now());
  useEffect(() => {
    const i = setInterval(() => setT(UNLOCK - Date.now()), 1000);
    return () => clearInterval(i);
  }, []);
  useEffect(() => { if (t <= 0) done(); }, [t <= 0]);

  const s = Math.max(0, t / 1000 | 0);
  const units = [
    ['Days', s / 86400 | 0],
    ['Hours', s / 3600 % 24 | 0],
    ['Minutes', s / 60 % 60 | 0],
    ['Seconds', s % 60]
  ];

  return (
    <Pg cls="min-h-screen flex flex-col items-center justify-center text-center px-5 gap-6 text-[#1c334e]">

/* ---------- Chapter 2: The Loading & 404 Prank ---------- */
function Load({ done }) {
  const [p, setP] = useState(0);
  useEffect(() => {
    const t0 = performance.now();
    let r, to;
    const f = t => {
      const k = Math.min(1, (t - t0) / 3200);
      setP(k * 100 | 0);
      k < 1 ? r = requestAnimationFrame(f) : to = setTimeout(done, 400);
    };
    r = requestAnimationFrame(f);
    return () => { cancelAnimationFrame(r); clearTimeout(to); };
  }, []);

  return (
    <Pg cls="min-h-screen flex flex-col items-center justify-center gap-6 px-6 text-center">
      <div className="w-16 h-16 rounded-full border-4 border-amber-300/30 border-t-amber-300 animate-spin mb-2" />

  );
}

/* ---------- App Root, Audio Player & Preview Navigator ---------- */
function fadeAudio(a, to, ms = 2500) {
  clearInterval(a._t);
  if (to > 0 && a.paused) a.play().catch(() => {});
  const from = a.volume, t0 = Date.now();
  a._t = setInterval(() => {
    const k = Math.min(1, (Date.now() - t0) / ms);
    a.volume = Math.max(0, Math.min(1, from + (to - from) * k));
    if (k >= 1) {
      clearInterval(a._t);
      if (!to) a.pause();
    }
  }, 50);
}

        {st === 'c3' && <C3 key="3" next={() => setSt('reasons')} />}
        {st === 'reasons' && <ReasonsScene key="rs" next={() => setSt('coupons')} />}
        {st === 'coupons' && <CouponsScene key="cp" next={() => setSt('c4')} />}
        {st === 'c4' && <C4 key="c4" next={() => setSt('c5')} />}
        {st === 'c5' && <C5 key="5" />}
      </AP>

      {/* Audio Consent Prompt */}
      <AP>
        {ask && !on && (
          <M.div
            initial={{ opacity: 0, y: -25 }}
            animate={{ opacity: 1, y: 0 }}
            exit={{ opacity: 0, y: -25 }}
            className="fixed top-20 left-1/2 -translate-x-1/2 z-50 glass rounded-2xl px-5 py-3 flex items-center gap-4 text-sm w-[92%] max-w-lg text-white shadow-2xl"
            style={{ background: 'rgba(18, 25, 45, 0.75)' }}
          >
            <span className="flex-1 font-medium">For the best cinematic audio experience, enable sound 🎵</span>
            <button
              onClick={() => { sounds.init(); setOn(true); setAsk(false); }}
              className="rounded-full bg-gradient-to-r from-amber-300 to-amber-400 text-slate-900 font-bold px-4 py-1.5 whitespace-nowrap shadow-md hover:scale-105 active:scale-95 transition"
            >
              Turn On Audio
            </button>
            <button onClick={() => setAsk(false)} aria-label="Dismiss" className="opacity-60 hover:opacity-100">
              ✕
            </button>
          </M.div>
        )}
      </AP>

      {/* Floating Music Vinyl Button */}
      <button
        onClick={() => { sounds.init(); setOn(!on); }}
        aria-label="Toggle music"
        className="fixed top-4 right-4 z-50 glass rounded-full pl-2 pr-4 py-2 flex items-center gap-3 text-white shadow-xl hover:scale-105 transition"
        style={{ background: 'rgba(18, 25, 45, 0.65)' }}
      >
        <M.div
          animate={on ? { rotate: 360 } : {}}
          transition={{ repeat: Infinity, duration: 4, ease: 'linear' }}
          className="w-9 h-9 rounded-full flex items-center justify-center relative"
          style={{ background: '#1a1a1a', boxShadow: 'inset 0 0 0 10px #222, inset 0 0 0 12px #f7b733' }}
        >
          <div className="w-2 h-2 rounded-full bg-white" />
        </M.div>
        <span className="flex items-end gap-0.5 h-4">
          {[0, 1, 2, 3].map(i => (
            <M.i
              key={i}
              className="block w-0.5 h-full bg-amber-300 rounded origin-bottom"
              animate={on ? { scaleY: [0.2, 1, 0.35, 0.8, 0.2] } : { scaleY: 0.2 }}
              transition={{ repeat: Infinity, duration: 0.9, delay: i * 0.15 }}
            />
          ))}
        </span>
        <span className="text-xs font-mono font-bold text-amber-200">{on ? 'PAUSE' : 'PLAY'}</span>
      </button>

      {/* Secret / Preview Stage Switcher */}
      {PREV && (
        <div className="fixed bottom-3 left-3 z-50 flex flex-wrap gap-1 text-xs">
          {['gate', 'load', '404', 'seoul', 'c3', 'reasons', 'coupons', 'c4', 'c5'].map(stage => (
            <button
              key={stage}
              onClick={() => setSt(stage)}
              className={`rounded px-2 py-1 font-mono transition ${st === stage ? 'bg-amber-400 text-slate-900 font-bold' : 'glass text-white/80'}`}
              style={{ background: st === stage ? '#f7b733' : 'rgba(18,25,45,0.7)' }}
            >
              {stage}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
